[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mh-orchestrator"
version = "0.1.0"
description = "MemoryHound LangGraph orchestrator — IR state machine wrapping Claude Code subagents"
readme = "README.md"
license = { file = "../LICENSE" }
requires-python = ">=3.11"
authors = [{ name = "MemoryHound Contributors" }]
dependencies = [
    "langgraph>=0.2.40,<0.3",
    "langchain-core>=0.3,<0.4",
    "networkx>=3.2,<4",
    "pydantic>=2.5",
    "protocol-sift-mcp",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
mh-orchestrate = "mh_orchestrator.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mh_orchestrator"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "S"]
ignore = ["S101", "S603", "S607"]

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=mh_orchestrator --cov-report=term-missing"
