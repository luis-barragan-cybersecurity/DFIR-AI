name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install (mcp-server + orchestrator)
        run: |
          python -m pip install --upgrade pip
          pip install -e "./mcp-server[dev]"
          pip install -e "./orchestrator"
      - name: Lint (ruff)
        run: ruff check mcp-server/src
      - name: Typecheck (mypy, non-blocking)
        run: mypy --config-file mcp-server/pyproject.toml mcp-server/src/protocol_sift_mcp || true
      - name: Test — mcp-server
        run: pytest mcp-server/tests
      - name: Test — orchestrator
        # Run in a separate invocation: the two suites have conftest.py files
        # with the same module name and pytest's importmode requires separate
        # rootdirs to avoid ImportPathMismatchError.
        run: pytest orchestrator/tests
